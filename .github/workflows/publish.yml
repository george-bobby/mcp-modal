name: Publish

# Releases mcp-modal to PyPI and the MCP Registry with NO stored secrets.
# Authentication is done entirely via GitHub Actions OIDC:
#   - PyPI uses Trusted Publishing (configured at pypi.org for this repo +
#     workflow `publish.yml`, with no GitHub environment).
#   - The MCP Registry uses `mcp-publisher login github-oidc`.
#
# Trigger by pushing a version tag (`git tag vX.Y.Z && git push --follow-tags`)
# or by running it manually from the Actions tab (workflow_dispatch) — handy for a
# tag that was pushed before this workflow existed.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  pypi:
    name: Publish to PyPI (Trusted Publishing)
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC: mint a short-lived PyPI token, no secret needed
      contents: read
    outputs:
      # 'true' only when this run actually uploaded a new version, so the registry
      # job below knows whether there is anything for it to publish.
      published: ${{ steps.check.outputs.exists == 'false' }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Build sdist + wheel
        run: uv build
      # PyPI versions are immutable: re-running this workflow for a version that is
      # already published fails the whole run, and re-pushing an existing tag (or a
      # manual dispatch on an old one) does exactly that. Worse, a rebuilt artifact
      # for a published version can differ byte-for-byte, so PyPI rejects it outright
      # rather than treating the upload as a no-op. Detect that case and skip.
      - name: Check whether this version is already on PyPI
        id: check
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if curl -fsS -o /dev/null "https://pypi.org/pypi/mcp-modal/$version/json"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::mcp-modal $version is already on PyPI — nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to PyPI
        if: steps.check.outputs.exists == 'false'
        run: uv publish --trusted-publishing always
      # Hand the exact artifacts to the release job rather than letting it rebuild:
      # a rebuild can differ byte-for-byte from what PyPI now serves, and a release
      # asset that doesn't match the published package is worse than no asset.
      - name: Upload artifacts for the release job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  registry:
    name: Publish to MCP Registry (OIDC)
    needs: pypi   # the registry validates that the PyPI version is already live
    # Skip when PyPI had nothing to publish — the registry rejects a duplicate
    # version too, and a re-pushed tag would otherwise fail here instead.
    if: needs.pypi.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC: authenticate mcp-publisher as this repo
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          url=$(curl -fsSL https://api.github.com/repos/modelcontextprotocol/registry/releases/latest \
            | grep -oE 'https://[^"]*linux[_-]amd64\.tar\.gz' | head -1)
          test -n "$url" || { echo "Could not find a linux/amd64 mcp-publisher asset"; exit 1; }
          echo "Downloading $url"
          curl -fsSL "$url" -o mcp-publisher.tar.gz
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --version
      - name: Authenticate via GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: ./mcp-publisher publish

  release:
    name: Create the GitHub Release
    needs: pypi
    # Only a tag names a version to release. A workflow_dispatch on a branch has no
    # tag, so there is nothing to attach a release to — skip rather than guess.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # creating a release writes to the repo
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # release notes are built from the tagged commit's message
      - name: Download the published artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # The release body is the tagged commit's own message. Annotated tags here carry
      # only "vX.Y.Z", while the release commit message is the actual changelog — so
      # read that, drop the trailing Co-Authored-By lines, and add install instructions.
      - name: Build the release notes
        id: notes
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          subject=$(git log -1 --format=%s "$tag")
          headline="${subject#*: }"
          {
            echo "## ${headline}"
            echo
            git log -1 --format=%b "$tag" | grep -v '^Co-Authored-By:'
            echo
            echo "---"
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "uvx mcp-modal@${version}          # run this exact version"
            echo "claude mcp add mcp-modal -- uvx mcp-modal@${version}"
            echo '```'
            echo
            echo "Also on PyPI: [mcp-modal ${version}](https://pypi.org/project/mcp-modal/${version}/)."
            echo "The \`.whl\` and \`.tar.gz\` below are the artifacts published to PyPI for this version."
          } > notes.md
          echo "title=${version} — ${headline}" >> "$GITHUB_OUTPUT"
      # Idempotent: re-running for an existing release refreshes its notes and assets
      # instead of failing, which matches the re-pushed-tag behavior of the jobs above.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "${{ steps.notes.outputs.title }}" --notes-file notes.md
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "${{ steps.notes.outputs.title }}" \
              --notes-file notes.md \
              --verify-tag
          fi
