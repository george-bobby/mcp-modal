[project]
name = "mcp-modal"
version = "0.2.0"
description = "MCP server for managing Modal apps, containers, volumes, and secrets."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "George Bobby" }]
keywords = ["mcp", "modal", "model-context-protocol", "claude"]
dependencies = [
    "mcp>=1.9.2",
    "modal>=1.0",
    "pydantic>=2.10.6",
    "uv>=0.6.9",
]

[project.urls]
Homepage = "https://github.com/george-bobby/mcp-modal"
Repository = "https://github.com/george-bobby/mcp-modal"

[project.scripts]
mcp-modal = "mcp_modal.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_modal"]
